<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; font-src 'self' data: file:; connect-src 'self'; frame-src 'self' file: blob: about:; object-src 'none'; base-uri 'none'; form-action 'none'">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>AI Sidebar Host</title>
	<style>
		html,
		body {
			width: 100%;
			height: 100%;
			margin: 0;
			background: #111315;
			overflow: hidden;
		}

		#claudian-sidebar-frame {
			width: 100%;
			height: 100%;
			border: 0;
			display: block;
			background: #111315;
		}
	</style>
</head>
<body>
	<iframe id="claudian-sidebar-frame" title="AI Sidebar" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads" allow="clipboard-read; clipboard-write"></iframe>
	<script src="./claudian-sidebar-embed-adapter.js"></script>
	<script src="./claudian-sidebar-embed-host.js"></script>
</body>
</html>
